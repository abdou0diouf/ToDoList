{% extends "base.html" %}


{% block title %}
Connexion
{% endblock %}


{% block content %}

<div class="row justify-content-center">

<div class="col-md-6">

<h2>
Connexion
</h2>


<form method="POST">

{% csrf_token %}


<div class="mb-3">

<label>
Nom utilisateur
</label>

<input 
type="text"
name="username"
class="form-control">

</div>


<div class="mb-3">

<label>
Mot de passe
</label>

<input 
type="password"
name="password"
class="form-control">

</div>


<button class="btn btn-primary">
Se connecter
</button>


</form>

</div>

</div>

{% endblock %}
