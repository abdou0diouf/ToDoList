{% extends "base.html" %}



{% block title %}

Mon profil

{% endblock %}





{% block content %}




<div class="row justify-content-center">


<div class="col-lg-6 col-md-8">





<div class="card shadow-sm">



<div class="card-body text-center">





<div class="mb-3">


<i class="bi bi-person-circle display-3 text-primary"></i>


</div>





<h1>

{{ user.username }}

</h1>




<p class="text-muted">

{{ user.email }}

</p>





<hr>





<p>


<i class="bi bi-calendar-event"></i>


Inscrit depuis


<br>


<strong>

{{ date_joined|date:"d/m/Y" }}

</strong>



</p>






<hr>







<div class="row g-3">





<div class="col-6">



<div class="card projects-card text-center h-100">



<div class="card-body">


<i class="bi bi-folder-fill fs-2"></i>



<h2>

{{ projects_count }}

</h2>



<p>

Projets

</p>



</div>



</div>



</div>







<div class="col-6">



<div class="card done-card text-center h-100">



<div class="card-body">


<i class="bi bi-check-circle-fill fs-2"></i>



<h2>

{{ tasks_count }}

</h2>



<p>

Tâches terminées

</p>



</div>



</div>



</div>





</div>






<hr>






<a href="{% url 'projects:dashboard' %}"

class="btn btn-outline-secondary">


<i class="bi bi-arrow-left"></i>


Retour au dashboard


</a>






</div>



</div>





</div>


</div>





{% endblock %}
